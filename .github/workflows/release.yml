name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Check that the tag matches module.json
        run: |
          version=$(node -p "require('./module.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.json version $version" >&2
            exit 1
          fi
      - name: Build module.zip
        run: zip -r module.zip module.json scripts lang LICENSE README.md CHANGELOG.md
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
